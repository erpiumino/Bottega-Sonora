name: Aggiorna Eventi

on:
  push:
    paths:
      - 'events/**'
  workflow_dispatch:

jobs:
  generate-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false  # importante per usare PAT

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate events.json
        run: node generate-events.js

      - name: Commit & Push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Aggiornamento automatico eventi"
          git push https://erpiumino:${{ secrets.PAT }}@github.com/erpiumino/Bottega-Sonora.git HEAD:main

