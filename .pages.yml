content:
  - name: events
    label: "Concerti"
    path: "events"
    type: collection
    format: "json"
    create: true
    match: "**/*.json"

    fields:
      - name: id
        label: "ID evento"
        type: string
        required: true

      - name: title
        label: "Titolo"
        type: string
        required: true

      - name: description
        label: "Descrizione"
        type: text
        required: true

      - name: date
        label: "Data"
        type: date
        required: true

      - name: time
        label: "Orario"
        type: string

      - name: place
        label: "Luogo"
        type: string
        required: true

      - name: maps_link
        label: "Google Maps Link"
        type: string

      - name: ticket_link
        label: "Ticket/Info Link"
        type: string

      - name: video_link
        label: "Video Link"
        type: string

      - name: image
        label: "Immagine"
        type: image
        required: true

    transform:
      output: |
        {
          "id": "{{id}}",
          "title": "{{title}}",
          "description": {{ description | jsonify }},
          "place": "{{place}}",
          "date": "{{date}}",
          "time": "{{time}}",
          "maps": "{{maps_link}}",
          "tickets": "{{ticket_link}}",
          "video": "{{video_link}}",
          "image": "{{image}}"
        }
