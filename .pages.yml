content:
  - name: event
    label: Evento
    path: events
    filename: '{year}-{month}-{day}-{fields.title}.md'
    type: collection
    view:
      fields: [heroImage, title, pubDate]
    fields:
      - name: title
        label: Titolo
        type: string

      - name: description
        label: Descrizione
        type: text

      - name: pubDate
        label: Data
        type: date
        options:
          time: true
          format: "dd/MM/yyyy HH:mm"

      - name: place
        label: Luogo
        type: string

      - name: url
        label: Link GoogleMaps
        type: string

      - name: heroImage
        label: Immagine
        type: image

      - name: tickets
        label: Link Biglietti
        type: string

media:
  input: assets/eventi
  output: /assets/eventi
